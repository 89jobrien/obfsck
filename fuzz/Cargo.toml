[package]
name = "obfsck-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_yaml = "0.9"

[dependencies.obfsck]
path = ".."
default-features = false

[[bin]]
name = "fuzz_obfuscate"
path = "fuzz_targets/fuzz_obfuscate.rs"
doc = false

[[bin]]
name = "fuzz_strip_ansi"
path = "fuzz_targets/fuzz_strip_ansi.rs"
doc = false

[[bin]]
name = "fuzz_level_monotonicity"
path = "fuzz_targets/fuzz_level_monotonicity.rs"
doc = false

[[bin]]
name = "fuzz_allowlist"
path = "fuzz_targets/fuzz_allowlist.rs"
doc = false

[[bin]]
name = "fuzz_yaml_config"
path = "fuzz_targets/fuzz_yaml_config.rs"
doc = false

[workspace]
