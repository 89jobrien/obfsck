name: CI

on:
  push:
    branches: [main, "feature/*", "hotfix/*", "chore/*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  compile-check:
    name: Compile, Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features analyzer,legacy-user-scan,path-policy-home-user-redact -- -D warnings
      - run: cargo clippy --workspace --all-targets --features analyzer,legacy-user-scan,path-policy-non-allowlisted-redact -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: compile-check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace

  site:
    name: Site Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      # Structure, JSON validity, and internal links.
      - run: rust-script scripts/validate-site.rs
      # site/cli.html must match the real --help output. The script falls back
      # to `cargo run` when nothing is installed, so this needs no release build.
      - run: rust-script scripts/gen-cli-help.rs --check

  audit:
    name: Audit & Deny
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
